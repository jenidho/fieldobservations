<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Existence Patterns</title>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&amp;family=Space+Mono:wght@400;700&amp;family=Inconsolata:wght@300;400&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: inherit;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.03; }
      50% { opacity: 0.08; }
    }

    @keyframes dataFlow {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(100px); opacity: 0; }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInOut {
      0% { opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .grid-line {
      position: absolute;
      background: currentColor;
      opacity: 0.05;
    }

    .data-particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: currentColor;
      animation: dataFlow linear infinite;
    }

    .observation-text {
      animation: fadeInOut 7s ease-in-out;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto"><!-- Content rendered by JS -->
  </div>
  <script>
    const defaultConfig = {
      background_color: "#0a0a0a",
      surface_color: "#e0e0e0",
      text_color: "#c0c0c0",
      accent_color: "#ffffff",
      secondary_accent_color: "#666666",
      font_family: "IBM Plex Mono",
      font_size: 14,
      static_phrase: "EXISTENCE REVEALS ITSELF IN"
    };

    const observations = [
      "the cartography of wrinkles mapping a lifetime of smiles", 
      "seeing your face reflected in the eyes of a lover",
      "the particular silence that follows a door closing forever",
      "the ritual of making loved ones a meal when words feel heavy",
      "the nostalgic vibrato of late summer rain",
      "handwritten marginalia slowly overtaking the authority of printed text",
      "sharing another person's pattern language",
      "the faint echo in a long hallway preserving conversations no one recalls",
      "the way dust motes become constellations in the afternoon light",
      "the familiar silence shared by two people who know each other very well",
      "the deepening comfort of routines once resisted",
      "flavors mellowing through prolonged fermentation",
      "the slow trust accumulated through ordinary days",
      "the quiet relief of slipping into inside clothes the moment you reach home",
      "the patina on brass handles recording daily departures",
      "when laughter lights up the room more than the joke itself",
      "the soft discoloration of walls where sunlight always falls",
      "hearing your name spoken without urgency",
      "the repetitive clatter of trains engraving time into infrastructure",
      "the slow silence in rooms once occupied",
      "dawn light filtering gently through ancient leaves",
      "frost crystals forming on morning glass",
      "hand-bound books crafted with love",
      "snowflake symmetry",
      "sunrise over sand dunes in Death Valley",
      "cloud formation systems",
      "body microbiomes",
      "the pelicans that orbit the pacific coast",
      "shared boredom with someone you love",
      "the way certain songs reopen memory doors that were once closed",
      "small acts of kindness that reshape the trajectory of a life",
      "the patience one learns when waiting for chai to boil",
      "the invincibility that overcomes you when you are in love",
      "the archaeology of coffee stains on a desk's weathered surface",
      "the geometry of cracks gilded in ancient pottery",
      "the resonance of a name spoken in your childhood home",
      "the precise angle at which moonlight breaks on water",
      "the taxonomy of textures on a single patch of tree bark",
      "the measurement of time in tealeaves coloring water"
    ];

    let config = { ...defaultConfig };
    let currentIndex = 0;
    let cycleInterval;
    let generativeCanvas;
    let animationFrame;

    function onConfigChange(newConfig) {
      config = { ...newConfig };
      render();
    }

    function generateGrid(container, color, spacing) {
      const width = container.offsetWidth;
      const height = container.offsetHeight;
      
      // Vertical lines
      for (let x = 0; x < width; x += spacing) {
        const line = document.createElement('div');
        line.className = 'grid-line';
        line.style.cssText = `
          left: ${x}px;
          top: 0;
          width: 1px;
          height: 100%;
          color: ${color};
          animation: gridPulse ${8 + Math.random() * 4}s ease-in-out infinite;
          animation-delay: ${Math.random() * 2}s;
        `;
        container.appendChild(line);
      }
      
      // Horizontal lines
      for (let y = 0; y < height; y += spacing) {
        const line = document.createElement('div');
        line.className = 'grid-line';
        line.style.cssText = `
          left: 0;
          top: ${y}px;
          width: 100%;
          height: 1px;
          color: ${color};
          animation: gridPulse ${8 + Math.random() * 4}s ease-in-out infinite;
          animation-delay: ${Math.random() * 2}s;
        `;
        container.appendChild(line);
      }
    }

    function generateDataParticles(container, color, count) {
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'data-particle';
        particle.style.cssText = `
          left: ${Math.random() * 100}%;
          top: ${Math.random() * 100}%;
          color: ${color};
          animation-duration: ${3 + Math.random() * 4}s;
          animation-delay: ${Math.random() * 3}s;
        `;
        container.appendChild(particle);
      }
    }

    function drawGenerativePattern(canvas, colors) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      ctx.clearRect(0, 0, width, height);
      
      const time = Date.now() * 0.0001;
      const centerX = width / 2;
      const centerY = height / 2;
      
      // Draw algorithmic circles based on observation index
      const rings = 12;
      for (let i = 0; i < rings; i++) {
        const progress = i / rings;
        const radius = 80 + progress * 180;
        const angle = time + progress * Math.PI * 2 + currentIndex * 0.1;
        const x = centerX + Math.cos(angle) * (progress * 30);
        const y = centerY + Math.sin(angle) * (progress * 30);
        
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 0.5;
        ctx.globalAlpha = 0.03 + Math.sin(time + i) * 0.02;
        ctx.stroke();
      }
      
      // Draw data connections
      const points = 8;
      for (let i = 0; i < points; i++) {
        const angle1 = (i / points) * Math.PI * 2 + time;
        const angle2 = ((i + 1) / points) * Math.PI * 2 + time;
        const r = 200 + Math.sin(time + i) * 50;
        
        const x1 = centerX + Math.cos(angle1) * r;
        const y1 = centerY + Math.sin(angle1) * r;
        const x2 = centerX + Math.cos(angle2) * r;
        const y2 = centerY + Math.sin(angle2) * r;
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = colors.secondary;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.1;
        ctx.stroke();
        
        // Draw nodes
        ctx.beginPath();
        ctx.arc(x1, y1, 2, 0, Math.PI * 2);
        ctx.fillStyle = colors.accent;
        ctx.globalAlpha = 0.3;
        ctx.fill();
      }
      
      animationFrame = requestAnimationFrame(() => drawGenerativePattern(canvas, colors));
    }

    function render() {
      const app = document.getElementById('app');
      const baseFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = `${baseFont}, monospace`;
      const baseSize = config.font_size || defaultConfig.font_size;
      
      const bgColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const accentColor = config.accent_color || defaultConfig.accent_color;
      const secondaryAccentColor = config.secondary_accent_color || defaultConfig.secondary_accent_color;

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }

      app.innerHTML = `
        <div style="
          min-height: 100%;
          width: 100%;
          background: ${bgColor};
          position: relative;
          overflow: hidden;
          font-family: ${baseFontStack};
        ">
          <!-- Grid system -->
          <div id="grid-container" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
          "></div>

          <!-- Generative canvas -->
          <canvas id="generative-canvas" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
          "></canvas>

          <!-- Data particles -->
          <div id="particle-container" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
          "></div>

          <!-- Scanline effect -->
          <div style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(transparent, ${accentColor}10, transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
          "></div>

          <!-- Main content -->
          <div style="
            position: relative;
            z-index: 10;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            padding: ${baseSize * 4}px;
          ">
            <!-- Header metadata -->
            <header style="
              display: grid;
              grid-template-columns: 1fr auto;
              gap: ${baseSize * 2}px;
              padding-bottom: ${baseSize * 2}px;
              border-bottom: 1px solid ${secondaryAccentColor}20;
              margin-bottom: ${baseSize * 4}px;
            ">
              <div>
                <div style="
                  font-size: ${baseSize * 0.7}px;
                  color: ${secondaryAccentColor};
                  letter-spacing: 0.15em;
                  margin-bottom: ${baseSize * 0.5}px;
                  text-transform: uppercase;
                ">FIELD OBSERVATIONS</div>
                <div style="
                  font-size: ${baseSize * 0.65}px;
                  color: ${secondaryAccentColor};
                  opacity: 0.5;
                  font-family: ${baseFontStack};
                ">generative_system_v2.1.3</div>
              </div>
              <div style="
                text-align: right;
                font-size: ${baseSize * 0.65}px;
                color: ${secondaryAccentColor};
                opacity: 0.5;
              ">
                <div id="timestamp"></div>
                <div>runtime: <span id="runtime">00:00</span></div>
              </div>
            </header>

            <!-- Main content area -->
            <main style="
              flex: 1;
              display: flex;
              flex-direction: column;
              justify-content: center;
              max-width: 900px;
              margin: 0 auto;
              width: 100%;
            ">
              <!-- System title -->
              <div style="
                margin-bottom: ${baseSize * 6}px;
              ">
                <div style="
                  font-size: ${baseSize * 0.7}px;
                  color: ${secondaryAccentColor};
                  letter-spacing: 0.2em;
                  margin-bottom: ${baseSize}px;
                  text-transform: uppercase;
                ">SYSTEM OUTPUT</div>
                <h1 style="
                  font-size: ${baseSize * 1.8}px;
                  font-weight: 500;
                  color: ${surfaceColor};
                  letter-spacing: 0.05em;
                  line-height: 1.4;
                  text-transform: uppercase;
                  font-family: ${baseFontStack};
                  border-left: 2px solid ${accentColor};
                  padding-left: ${baseSize * 1.5}px;
                ">${config.static_phrase || defaultConfig.static_phrase}</h1>
              </div>

              <!-- Data visualization area -->
              <div style="
                border: 2px solid ${accentColor}40;
                padding: ${baseSize * 2.5}px ${baseSize * 3}px;
                margin-bottom: ${baseSize * 4}px;
                background: linear-gradient(135deg, ${bgColor}, ${secondaryAccentColor}05);
                position: relative;
                box-shadow: 0 0 60px ${accentColor}20, inset 0 0 60px ${accentColor}05;
              ">
                <!-- Corner markers - enhanced -->
                <div style="position: absolute; top: -2px; left: -2px; width: ${baseSize * 2}px; height: ${baseSize * 2}px; border-top: 3px solid ${accentColor}; border-left: 3px solid ${accentColor};"></div>
                <div style="position: absolute; top: -2px; right: -2px; width: ${baseSize * 2}px; height: ${baseSize * 2}px; border-top: 3px solid ${accentColor}; border-right: 3px solid ${accentColor};"></div>
                <div style="position: absolute; bottom: -2px; left: -2px; width: ${baseSize * 2}px; height: ${baseSize * 2}px; border-bottom: 3px solid ${accentColor}; border-left: 3px solid ${accentColor};"></div>
                <div style="position: absolute; bottom: -2px; right: -2px; width: ${baseSize * 2}px; height: ${baseSize * 2}px; border-bottom: 3px solid ${accentColor}; border-right: 3px solid ${accentColor};"></div>

                <!-- Animated border glow -->
                <div style="
                  position: absolute;
                  top: 0;
                  left: 0;
                  right: 0;
                  bottom: 0;
                  border: 1px solid ${accentColor};
                  opacity: 0.3;
                  animation: gridPulse 3s ease-in-out infinite;
                  pointer-events: none;
                "></div>

                <!-- Observation data -->
                <div id="observation-container" style="width: 100%;">
                  <div style="
                    font-size: ${baseSize * 0.7}px;
                    color: ${accentColor};
                    letter-spacing: 0.2em;
                    margin-bottom: ${baseSize}px;
                    text-transform: uppercase;
                    opacity: 0.7;
                  ">DATA_POINT_<span id="data-index">001</span></div>
                  <p style="
                    font-family: ${baseFontStack};
                    font-size: ${baseSize * 1.6}px;
                    font-weight: 300;
                    color: ${textColor};
                    line-height: 1.8;
                    letter-spacing: 0.03em;
                    max-width: 800px;
                  ">${observations[0]}</p>
                </div>
              </div>

              <!-- Navigation scrollbar -->
              <div style="
                margin-bottom: ${baseSize * 3}px;
                border: 1px solid ${secondaryAccentColor}20;
                padding: ${baseSize * 2}px;
                background: ${bgColor};
              ">
                <div style="
                  font-size: ${baseSize * 0.6}px;
                  color: ${secondaryAccentColor};
                  letter-spacing: 0.1em;
                  margin-bottom: ${baseSize * 1.5}px;
                  text-transform: uppercase;
                ">OBSERVATION NAVIGATOR</div>
                
                <div style="
                  display: flex;
                  align-items: center;
                  gap: ${baseSize * 2}px;
                ">
                  <button id="nav-prev" style="
                    background: none;
                    border: 1px solid ${accentColor};
                    color: ${accentColor};
                    width: ${baseSize * 2.5}px;
                    height: ${baseSize * 2.5}px;
                    cursor: pointer;
                    font-size: ${baseSize * 0.8}px;
                    font-family: ${baseFontStack};
                    transition: all 0.2s;
                  ">◄</button>
                  
                  <div style="
                    flex: 1;
                    height: ${baseSize * 2.5}px;
                    background: ${secondaryAccentColor}10;
                    position: relative;
                    border: 1px solid ${secondaryAccentColor}20;
                  ">
                    <div id="scrollbar-track" style="
                      position: absolute;
                      top: 0;
                      left: 0;
                      width: 100%;
                      height: 100%;
                      cursor: pointer;
                    ">
                      <div id="scrollbar-thumb" style="
                        position: absolute;
                        top: 0;
                        left: 0;
                        height: 100%;
                        width: ${(1 / observations.length) * 100}%;
                        background: ${accentColor};
                        border-right: 2px solid ${bgColor};
                        transition: left 0.3s ease;
                      "></div>
                      
                      <!-- Tick marks -->
                      <div style="
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        display: flex;
                        pointer-events: none;
                      ">
                        ${Array.from({length: observations.length}, (_, i) => `
                          <div style="
                            flex: 1;
                            border-right: 1px solid ${secondaryAccentColor}15;
                            height: 100%;
                          "></div>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                  
                  <button id="nav-next" style="
                    background: none;
                    border: 1px solid ${accentColor};
                    color: ${accentColor};
                    width: ${baseSize * 2.5}px;
                    height: ${baseSize * 2.5}px;
                    cursor: pointer;
                    font-size: ${baseSize * 0.8}px;
                    font-family: ${baseFontStack};
                    transition: all 0.2s;
                  ">►</button>
                </div>
              </div>

              <!-- System metrics -->
              <div style="
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: ${baseSize * 2}px;
              ">
                <div style="
                  border: 1px solid ${secondaryAccentColor}20;
                  padding: ${baseSize * 1.5}px;
                  background: ${bgColor};
                ">
                  <div style="
                    font-size: ${baseSize * 0.6}px;
                    color: ${secondaryAccentColor};
                    letter-spacing: 0.1em;
                    margin-bottom: ${baseSize * 0.5}px;
                    text-transform: uppercase;
                  ">SEQUENCE</div>
                  <div style="
                    font-size: ${baseSize * 1.5}px;
                    color: ${accentColor};
                    font-weight: 500;
                  " id="counter">001/045</div>
                </div>
                
                <div style="
                  border: 1px solid ${secondaryAccentColor}20;
                  padding: ${baseSize * 1.5}px;
                  background: ${bgColor};
                ">
                  <div style="
                    font-size: ${baseSize * 0.6}px;
                    color: ${secondaryAccentColor};
                    letter-spacing: 0.1em;
                    margin-bottom: ${baseSize * 0.5}px;
                    text-transform: uppercase;
                  ">INTERVAL</div>
                  <div style="
                    font-size: ${baseSize * 1.5}px;
                    color: ${accentColor};
                    font-weight: 500;
                  " id="interval-display">7.0s</div>
                </div>

                <div style="
                  border: 1px solid ${secondaryAccentColor}20;
                  padding: ${baseSize * 1.5}px;
                  background: ${bgColor};
                ">
                  <div style="
                    font-size: ${baseSize * 0.6}px;
                    color: ${secondaryAccentColor};
                    letter-spacing: 0.1em;
                    margin-bottom: ${baseSize * 0.5}px;
                    text-transform: uppercase;
                  ">STATUS</div>
                  <div style="
                    font-size: ${baseSize * 1.5}px;
                    color: ${accentColor};
                    font-weight: 500;
                  " id="status-display">ACTIVE</div>
                </div>
              </div>
            </main>
          </div>
        </div>
      `;

      // Initialize grid
      const gridContainer = document.getElementById('grid-container');
      generateGrid(gridContainer, secondaryAccentColor, 80);

      // Initialize particles
      const particleContainer = document.getElementById('particle-container');
      generateDataParticles(particleContainer, accentColor, 20);

      // Initialize canvas
      generativeCanvas = document.getElementById('generative-canvas');
      generativeCanvas.width = generativeCanvas.offsetWidth;
      generativeCanvas.height = generativeCanvas.offsetHeight;
      drawGenerativePattern(generativeCanvas, {
        accent: accentColor,
        secondary: secondaryAccentColor
      });

      // Update timestamp
      const timestamp = document.getElementById('timestamp');
      const now = new Date();
      timestamp.textContent = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      // Runtime counter
      let startTime = Date.now();
      setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const seconds = String(elapsed % 60).padStart(2, '0');
        const runtime = document.getElementById('runtime');
        if (runtime) {
          runtime.textContent = `${minutes}:${seconds}`;
        }
      }, 1000);

      startCycle();
    }

    function updateObservation() {
      const container = document.getElementById('observation-container');
      const counter = document.getElementById('counter');
      const dataIndex = document.getElementById('data-index');
      const scrollbarThumb = document.getElementById('scrollbar-thumb');
      
      if (!container) return;

      const baseSize = config.font_size || defaultConfig.font_size;
      const baseFontStack = `${config.font_family || defaultConfig.font_family}, monospace`;
      const textColor = config.text_color || defaultConfig.text_color;
      const secondaryAccentColor = config.secondary_accent_color || defaultConfig.secondary_accent_color;
      
      const displayIndex = String(currentIndex + 1).padStart(3, '0');
      const totalCount = String(observations.length).padStart(3, '0');
      
      if (counter) {
        counter.textContent = `${displayIndex}/${totalCount}`;
      }
      if (dataIndex) {
        dataIndex.textContent = displayIndex;
      }
      if (scrollbarThumb) {
        const position = (currentIndex / observations.length) * 100;
        scrollbarThumb.style.left = `${position}%`;
      }

      const accentColor = config.accent_color || defaultConfig.accent_color;
      
      container.innerHTML = `
        <div class="observation-text">
          <div style="
            font-size: ${baseSize * 0.7}px;
            color: ${accentColor};
            letter-spacing: 0.2em;
            margin-bottom: ${baseSize}px;
            text-transform: uppercase;
            opacity: 0.7;
          ">DATA_POINT_${displayIndex}</div>
          <p style="
            font-family: ${baseFontStack};
            font-size: ${baseSize * 1.6}px;
            font-weight: 300;
            color: ${accentColor};
            line-height: 1.8;
            letter-spacing: 0.03em;
            text-shadow: 0 0 30px ${accentColor}60, 0 0 60px ${accentColor}30, 0 0 90px ${accentColor}15;
            max-width: 800px;
          ">${observations[currentIndex]}</p>
        </div>
      `;
    }

    function navigateToIndex(index) {
      currentIndex = index;
      updateObservation();
      resetTimer();
    }

    function navigatePrev() {
      currentIndex = (currentIndex - 1 + observations.length) % observations.length;
      updateObservation();
      resetTimer();
    }

    function navigateNext() {
      currentIndex = (currentIndex + 1) % observations.length;
      updateObservation();
      resetTimer();
    }

    function resetTimer() {
      if (cycleInterval) {
        clearInterval(cycleInterval);
      }
      startCycle();
    }

    function startCycle() {
      if (cycleInterval) {
        clearInterval(cycleInterval);
      }

      cycleInterval = setInterval(() => {
        currentIndex = (currentIndex + 1) % observations.length;
        updateObservation();
      }, 7000);

      // Setup navigation controls
      const prevBtn = document.getElementById('nav-prev');
      const nextBtn = document.getElementById('nav-next');
      const scrollbarTrack = document.getElementById('scrollbar-track');

      if (prevBtn) {
        prevBtn.onclick = navigatePrev;
        prevBtn.onmouseenter = function() {
          this.style.background = config.accent_color || defaultConfig.accent_color;
          this.style.color = config.background_color || defaultConfig.background_color;
        };
        prevBtn.onmouseleave = function() {
          this.style.background = 'none';
          this.style.color = config.accent_color || defaultConfig.accent_color;
        };
      }

      if (nextBtn) {
        nextBtn.onclick = navigateNext;
        nextBtn.onmouseenter = function() {
          this.style.background = config.accent_color || defaultConfig.accent_color;
          this.style.color = config.background_color || defaultConfig.background_color;
        };
        nextBtn.onmouseleave = function() {
          this.style.background = 'none';
          this.style.color = config.accent_color || defaultConfig.accent_color;
        };
      }

      if (scrollbarTrack) {
        scrollbarTrack.onclick = function(e) {
          const rect = this.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const percentage = clickX / rect.width;
          const targetIndex = Math.floor(percentage * observations.length);
          navigateToIndex(targetIndex);
        };
      }
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
